<title>HomeFinder Explorer Deck</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=block">
<style>
:root {

  --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
}
* { box-sizing: border-box; margin: 0; }
:root { color-scheme: dark; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#deck { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; cursor: pointer; user-select: none; }
#hint { position: absolute; left: 96px; right: 96px; top: 1036px; display: flex; justify-content: space-between; font: 500 15px/1 var(--mono); letter-spacing: .08em; color: var(--ink3); }
#hint kbd { font: inherit; padding: 3px 7px; border-radius: 6px; background: var(--sheet2); box-shadow: 0 0 0 1px var(--hair); color: var(--ink2); }
#hint b { color: var(--ink); font-weight: 500; }
#cap { display: none !important; }
#deck .scene { top: 250px; }
#bg { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,250,.07) 1.2px, transparent 1.4px); background-size: 36px 36px; }
#glow { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; background: radial-gradient(circle, rgba(138,166,245,.13), transparent 62%); }
#glow2 { position: absolute; width: 1100px; height: 1100px; border-radius: 50%; background: radial-gradient(circle, rgba(242,132,95,.07), transparent 62%); }
.abs { position: absolute; }
#hdr { left: 96px; top: 64px; display: grid; gap: 10px; }
#hdr .k { font: 500 15px/1 var(--mono); letter-spacing: .14em; color: var(--ink3); text-transform: uppercase; }
#hdr .t { font: 600 34px/1.1 var(--sans); letter-spacing: -.01em; display: flex; gap: 16px; align-items: baseline; }
#hdr .t em { font: 500 26px/1 var(--mono); font-style: normal; color: var(--accent); }
#dots { right: 96px; top: 74px; display: flex; gap: 10px; }
#dots i { width: 34px; height: 4px; border-radius: 4px; background: var(--hair2); overflow: hidden; display: block; }
#dots i u { display: block; height: 100%; width: 0; background: var(--ink); }
.scene { position: absolute; left: 96px; top: 170px; width: 1728px; height: 660px; }
/* caption */
#cap { left: 96px; right: 96px; top: 872px; height: 150px; display: grid; grid-template-columns: 300px 1fr; gap: 40px; align-items: start; }
.spk { display: grid; gap: 14px; }
.who { display: flex; align-items: center; gap: 14px; opacity: .38; }
.who.on { opacity: 1; }
.av { position: relative; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font: 600 20px/1 var(--sans); color: #121211; }
.av::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid currentColor; opacity: var(--lv, 0); transform: scale(calc(1 + var(--lv, 0) * .25)); }
.who b { font-size: 19px; font-weight: 600; display: block; }
.who small { font: 400 14px/1.2 var(--mono); color: var(--ink3); }
#line { font: 500 33px/1.42 var(--sans); letter-spacing: -.005em; color: var(--ink3); max-width: 1300px; }
#line .w.on { color: var(--ink); }
/* shared bits */
.card { position: absolute; background: var(--sheet); border-radius: 22px; box-shadow: 0 30px 70px rgba(0,0,0,.45), 0 0 0 1px var(--hair); }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; background: var(--sheet2); box-shadow: 0 0 0 1px var(--hair); font: 500 22px/1 var(--sans); color: var(--ink); white-space: nowrap; }
.mono { font-family: var(--mono); }
.lbl { font: 500 16px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink3); }
.big { font: 600 92px/1.02 var(--sans); letter-spacing: -.035em; }
.ic { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.tile { width: 54px; height: 54px; border-radius: 15px; display: grid; place-items: center; background: var(--sheet2); color: var(--accent); flex: none; }
.node { position: absolute; display: flex; align-items: center; gap: 14px; padding: 16px 20px; background: var(--sheet); border-radius: 18px; box-shadow: 0 20px 50px rgba(0,0,0,.4), 0 0 0 1px var(--hair); font: 600 22px/1.15 var(--sans); white-space: nowrap; }
.node small { display: block; font: 400 15px/1.3 var(--mono); color: var(--ink3); margin-top: 3px; }
.node .ic { color: var(--accent); }
.node.hot { box-shadow: 0 20px 50px rgba(0,0,0,.4), 0 0 0 2.5px var(--accent); }
.node.bad { box-shadow: 0 20px 50px rgba(0,0,0,.4), 0 0 0 2.5px var(--signal); }
svg.wires { position: absolute; left: 0; top: 0; overflow: visible; }
svg.wires path { fill: none; stroke: var(--hair2); stroke-width: 2.5; stroke-dasharray: 2 9; stroke-linecap: round; }
.dot { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px var(--accentS), 0 0 24px var(--accent); }
.dot.r { background: var(--signal); box-shadow: 0 0 0 6px var(--signalS); }
.vs { position: absolute; top: 40px; width: 760px; padding: 44px 46px; min-height: 400px; }
.vs h3 { font: 600 54px/1 var(--sans); letter-spacing: -.02em; display: flex; align-items: center; gap: 16px; }
.vs .tagc { font: 600 15px/1 var(--mono); letter-spacing: .1em; padding: 7px 11px; border-radius: 8px; margin-left: auto; }

.barrow { position: absolute; left: 0; width: 1728px; display: grid; grid-template-columns: 300px 1fr 260px; align-items: center; gap: 28px; }

.stamp { position: absolute; font: 700 84px/1 var(--sans); letter-spacing: -.035em; }

.hx.ring { fill: rgba(242,132,95,.24); stroke: var(--signal); }
.hx.out { opacity: .4; }
.seg { position: absolute; height: 100%; top: 0; display: grid; place-items: center; font: 600 18px/1 var(--mono); color: #121211; border-right: 3px solid var(--bg); }
.k3 { position: absolute; top: 30px; width: 548px; height: 470px; padding: 38px; display: grid; align-content: start; gap: 18px; }
.k3 h3 { font: 600 50px/1 var(--sans); letter-spacing: -.02em; display: flex; align-items: center; gap: 12px; }
.k3 p { font: 400 30px/1.42 var(--sans); color: var(--ink2); }
.k3 .tagc { font: 600 14px/1 var(--mono); letter-spacing: .1em; padding: 7px 10px; border-radius: 8px; margin-left: auto; }
.banner { position: absolute; left: 0; right: 0; padding: 24px 32px; border-radius: 18px; background: var(--signalS); box-shadow: 0 0 0 1.5px var(--signal); font: 500 26px/1.3 var(--sans); display: flex; gap: 16px; align-items: center; }
.banner .ic { color: var(--signal); }
.ev { position: absolute; display: flex; gap: 10px; align-items: center; padding: 14px 20px; border-radius: 14px; background: var(--sheet); box-shadow: 0 16px 40px rgba(0,0,0,.4), 0 0 0 1px var(--hair); font: 500 22px/1.2 var(--mono); white-space: nowrap; }
.ev.r { box-shadow: 0 0 0 2.5px var(--signal); color: var(--ink3); }
.ev.g { box-shadow: 0 0 0 2.5px var(--accent); }
.rc { position: absolute; left: 0; font: 600 52px/1.15 var(--sans); letter-spacing: -.025em; display: flex; gap: 26px; align-items: baseline; }
.rc em { font: 500 26px/1 var(--mono); font-style: normal; color: var(--accent); width: 48px; }
</style>

    <div class="who" id="wS"><span class="av" style="background:var(--accent);color:var(--accent)"><span style="color:#121211">S</span></span><span><b>Sam</b><small>the architect</small></span></div>

<div id="hint"><span id="hs"></span><span><kbd>←</kbd> <kbd>→</kbd> step &nbsp; <kbd>↑</kbd> <kbd>↓</kbd> chapter &nbsp; <kbd>F</kbd> full screen &nbsp;&nbsp; <b id="hn2"></b></span></div></div>
<script>
const TL = {"fps":30,"scenes":[{"id":"intro","t0":3.0,"dur":22.407,"lines":[{"s":"Maya","text":"Welcome back. Today is pitch practice. Tomorrow you stand in front of an architecture committee and present HomeFinder, and we want you to walk in calm.","t0":3.0,"t1":12.356},{"s":"Sam","text":"Right. Not a tour of every box. A story the committee can follow, with a clear reason behind each choice, and an answer ready when they push back.","t0":12.356,"t1":21.988},{"s":"Maya","text":"So let's build the pitch in the order you'll actually say it.","t0":21.988,"t1":25.407}]},{"id":"frame","t0":27.407,"dur":38.047,"lines":[{"s":"Maya","text":"First thirty seconds. How do you open?","t0":27.407,"t1":30.153},{"s":"Sam","text":"With the shape of the problem, in numbers. A hundred million users a month. Two hundred million properties. Eight hundred MLS feeds, and about five million active listings.","t0":30.153,"t1":40.945},{"s":"Maya","text":"And the number people forget?","t0":40.945,"t1":42.887},{"s":"Sam","text":"Writes are small. About a million listing changes a day, which is only twelve events a second on average. Reads are big. Around twenty-five thousand searches a second at peak, with a target of under two hundred milliseconds at p ninety-five.","t0":42.887,"t1":56.963},{"s":"Maya","text":"So the headline is: read heavy, write light.","t0":56.963,"t1":60.489},{"s":"Sam","text":"Exactly. Say that early, because almost every decision later falls out of it.","t0":60.489,"t1":65.453}]},{"id":"rule","t0":67.453,"dur":32.127,"lines":[{"s":"Maya","text":"Then give them one rule to hang everything on.","t0":67.453,"t1":70.525},{"s":"Sam","text":"Managed where the protocol is open. Proprietary only behind an adapter. We buy AlloyDB because it speaks Postgres, and Memorystore because it speaks the Redis protocol. Leaving either one is a migration, not a rewrite.","t0":70.525,"t1":84.967},{"s":"Maya","text":"And the Google-only pieces, like Pub/Sub and Cloud Tasks?","t0":84.967,"t1":89.27},{"s":"Sam","text":"They stay off the user request path, behind one small adapter, with events in the CloudEvents format. If we ever move to Kafka, we rewrite one module, not every service.","t0":89.27,"t1":99.579}]},{"id":"ingest","t0":101.579,"dur":47.166,"lines":[{"s":"Maya","text":"Walk me through how a listing gets in.","t0":101.579,"t1":103.688},{"s":"Sam","text":"Each MLS gets its own Cloud Tasks queue, with a rate cap that matches its contract. The queue triggers an ingest job on Cloud Run. Ingest saves the raw payload to the lake, maps it to standard RESO fields, validates, geocodes, and resolves it to one property ID.","t0":103.688,"t1":120.095},{"s":"Maya","text":"Why a queue per MLS, and not one big poller?","t0":120.095,"t1":123.49},{"s":"Sam","text":"Because a slow or angry MLS can't starve the other seven hundred ninety-nine. Retries with backoff come built in, and each contract's limit lives in config.","t0":123.49,"t1":134.425},{"s":"Maya","text":"Then it's stored once, and fanned out.","t0":134.425,"t1":139.061},{"s":"Sam","text":"AlloyDB commits the golden record with an outbox row in the same transaction. That becomes a property changed event on Pub/Sub, and five subscribers react: search reindex, cache purge, alerts, valuation, and a BigQuery history row.","t0":139.061,"t1":148.746}]},{"id":"kafka","t0":150.746,"dur":30.887,"lines":[{"s":"Maya","text":"Here's the first push back you'll get. Why not Kafka? Everyone uses Kafka.","t0":150.746,"t1":155.109},{"s":"Sam","text":"Kafka is great when you have the scale to justify brokers and partitions. We have twelve events a second. Pub/Sub gives us fan-out, dead-letter topics, and replay with nobody on call for a cluster.","t0":155.109,"t1":168.26},{"s":"Maya","text":"And why not Cloud Tasks for the fan-out too?","t0":168.26,"t1":171.204},{"s":"Sam","text":"A task hits one target. Five consumers would mean five tasks, and every new consumer would change the producer. With Pub/Sub, a new consumer is just one more subscription.","t0":171.204,"t1":181.632}]},{"id":"data","t0":183.632,"dur":37.967,"lines":[{"s":"Maya","text":"Second push back. Why AlloyDB and not Spanner?","t0":183.632,"t1":187.628},{"s":"Sam","text":"Spanner sells multi-region writes and five nines. We write about two terabytes at twelve writes a second from one region. We'd pay for global consistency we don't use, and we'd lose PostGIS, which we need for neighborhood and school-zone polygons.","t0":187.628,"t1":203.061},{"s":"Maya","text":"And ordering? Events can arrive out of order.","t0":203.061,"t1":206.134},{"s":"Sam","text":"We don't trust ordering keys. They only keep publish order, and one poison message blocks the whole key. Instead every write carries the MLS modification timestamp and a sequence, and we only write if it's newer. Retries, redelivery and replay all become safe.","t0":206.134,"t1":221.599}]},{"id":"search","t0":223.599,"dur":49.087,"lines":[{"s":"Maya","text":"Now the deep dive. Geo search.","t0":223.599,"t1":226.396},{"s":"Sam","text":"OpenSearch on GKE. It's the one stateful system we run ourselves, because geo plus ranking is the product. We need geo shapes, custom ranking and facets we control. Vertex AI Search is a relevance black box, and it isn't geo first.","t0":226.396,"t1":238.302},{"s":"Maya","text":"How do you make a map search fast?","t0":238.302,"t1":243.124},{"s":"Sam","text":"Every listing is tagged with H3 hexagon cells when it's written, not when it's searched. A map viewport becomes a set of cells. Cells fully inside the viewport match on a simple term filter. Only the ring of cells on the edge gets the exact polygon check.","t0":243.124,"t1":259.18},{"s":"Maya","text":"So the expensive math runs on a thin ring, not the whole map.","t0":259.18,"t1":264.95},{"s":"Sam","text":"And the whole trip fits the budget. Edge, gateway, cache, about seventy milliseconds in OpenSearch, re-rank, hydrate. Around a hundred and sixty in total.","t0":264.95,"t1":272.685}]},{"id":"cache","t0":274.685,"dur":49.206,"lines":[{"s":"Maya","text":"Use the cache as your build versus buy story.","t0":274.685,"t1":277.802},{"s":"Sam","text":"We buy Memorystore for Valkey. Google runs failover with a ninety-nine point nine nine percent SLA, and it speaks the Redis protocol. The hot set is fifty to a hundred gigabytes, so raw speed doesn't decide this.","t0":277.802,"t1":291.305},{"s":"Maya","text":"Why not Dragonfly? It's faster.","t0":291.305,"t1":292.481},{"s":"Sam","text":"It is, on one big node. But then failover, upgrades and the pager are ours, and that costs more than the nodes we'd save. Our switch trigger is written down: if cache becomes a top three cost, or a hot key outgrows one shard, we revisit. The cache can be rebuilt from AlloyDB, so it's the safest thing to self-host later.","t0":292.481,"t1":313.963},{"s":"Maya","text":"And Redis itself?","t0":313.963,"t1":315.438},{"s":"Sam","text":"Same performance class. Redis moved off the BSD license in twenty twenty-four. Valkey is the open fork under the Linux Foundation, same API. So the license decides.","t0":315.438,"t1":323.892}]},{"id":"cost","t0":325.892,"dur":43.806,"lines":[{"s":"Maya","text":"Last section. Cost.","t0":325.892,"t1":327.736},{"s":"Sam","text":"Show one bill that adds up to a hundred percent. Photo storage is thirty. Image egress and CDN is twenty-five. Together that's over half the bill, so that's where we start. Lifecycle rules move photos from Standard to Nearline at thirty days, Coldline at ninety, and Archive once a home sells.","t0":327.736,"t1":344.542},{"s":"Maya","text":"And BigQuery?","t0":344.542,"t1":345.769},{"s":"Sam","text":"Steady jobs like ETL and training run on a baseline slot reservation with autoscaling. Analysts pay on demand per terabyte scanned. Tables are partitioned by date and clustered by H3 cell, so a query only scans the days and the cells it needs.","t0":345.769,"t1":359.964},{"s":"Maya","text":"One line for build versus buy?","t0":359.964,"t1":362.385},{"s":"Sam","text":"Buy what is stateful, painful to run, and speaks an open protocol. Build what makes us different: ranking and valuation.","t0":362.385,"t1":369.698}]},{"id":"close","t0":371.698,"dur":29.407,"lines":[{"s":"Maya","text":"Give me the close. Twenty seconds.","t0":371.698,"t1":374.039},{"s":"Sam","text":"Read heavy, write light. One rule: managed where the protocol is open, proprietary behind an adapter. One write region, one event backbone, one search cluster we own because it is the product. And every choice has a written trigger for when we'd change it.","t0":374.039,"t1":390.552},{"s":"Maya","text":"That last line is what committees love. You're not defending choices forever, you're telling them when you'd revisit.","t0":390.552,"t1":397.116},{"s":"Sam","text":"Say it slowly, then take questions. You've got this.","t0":397.116,"t1":401.105}]}],"env":[],"total":406.105};
const $ = (s, r = document) => r.querySelector(s);
const IC = {

  layers: '<path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/>',

};
const ic = n => `<svg class="ic" viewBox="0 0 24 24">${IC[n]}</svg>`;
const ease = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2;

const mk = (parent, html, cls = "", style = "") => { const d = document.createElement("div"); if (cls) d.className = cls; if (style) d.style.cssText = style; d.innerHTML = html; parent.appendChild(d); return d; };
const TITLES = { intro: "Tomorrow's pitch", frame: "Open with the shape of the problem", rule: "One rule to hang it on", ingest: "How a listing gets in", kafka: "Push back: why not Kafka?", data: "Push back: why not Spanner?", search: "Deep dive: geo search", cache: "Build vs buy: the cache", cost: "Cost, in one bill", close: "The close" };

const B = {};
B.intro = el => {
  const t1 = mk(el, "How to pitch HomeFinder", "big abs", "left:0;top:150px;font-size:118px");

  const one = mk(el, `<span style="color:var(--accent)">Buy</span> what is stateful, painful and open. <span style="color:var(--signal)">Build</span> what makes us different.`, "abs", "left:0;top:545px;font:600 44px/1.2 var(--sans);letter-spacing:-.02em");
  return (t, L) => {
    sh(bar, E(t, -.2), 20);
    const hl = t < L[1] + 2 ? -1 : t < L[1] + 6 ? 0 : t < L[3] ? 1 : -2;
    segs.forEach((s, k) => { s.style.opacity = hl === -1 || hl === -2 ? 1 : (k === 0 || (hl === 1 && k === 1)) ? 1 : .25; });
    sh(half, E(t, L[1] + 6.5) * (1 - E(t, L[1] + 8.5)), 14);
    life.forEach((c, k) => sh(c, E(t, L[1] + 9 + k * 1.3), 14));
    sh(bq1, E(t, L[3] + .5), 24); sh(bq2, E(t, L[3] + 5), 24); sh(part, E(t, L[3] + 8.5), 14); sh(one, E(t, L[5] + .2), 24);
  };
};
B.close = el => {
  const R = [["Read heavy, write light."], ["Managed where open. Proprietary behind an adapter."], ["One write region · one event bus · one search cluster we own."], ["Every choice has a written trigger to revisit it."]];
  const rs = R.map((r, k) => mk(el, `<em>0${k + 1}</em><span>${r[0]}</span>`, "rc", `top:${40 + k * 120}px;${k === 3 ? "color:var(--accent)" : ""}`));
  const end = mk(el, "You've got this.", "abs", "left:0;top:560px;font:500 34px/1 var(--sans);color:var(--ink2)");
  return (t, L) => { const d = L[1]; [d + .2, d + 2.5, d + 7, d + 12.5].forEach((a, k) => sh(rs[k], E(t, a, .9), 26)); sh(end, E(t, L[3] + .2), 14); };
};

for (const id in S) S[id].draw = B[id](S[id].el);

function render(t) {
  const fi = Math.min(TL.env.length - 1, Math.floor(t * TL.fps)), lv = TL.env[fi] || 0;
  $("#glow").style.transform = `translate(${-200 + 260 * Math.sin(t / 23)}px, ${-500 + 160 * Math.cos(t / 31)}px)`;
  $("#glow2").style.transform = `translate(${1100 + 200 * Math.cos(t / 27)}px, ${300 + 120 * Math.sin(t / 19)}px)`;
  $("#bg").style.backgroundPosition = `${-t * 4}px ${-t * 2}px`;
  let cur = 0; TL.scenes.forEach((sc, i) => { if (t >= sc.t0 - 1) cur = i; });
  TL.scenes.forEach((sc, i) => {
    const s = S[sc.id], end = sc.t0 + sc.dur, inP = E(t, sc.t0 - 1.1, .9), outP = 1 - cl((t - end - .5) / .7);
    const vis = i === TL.scenes.length - 1 ? inP : Math.min(inP, outP);
    s.el.style.display = vis <= 0.001 ? "none" : "block"; if (vis <= .001) return;
    s.el.style.opacity = vis; s.el.style.transform = `translateY(${(1 - inP) * 30 - (1 - outP) * 20}px)`;
    s.draw(t - sc.t0, sc.lines.map(l => l.t0 - sc.t0));
  });
  const sc = TL.scenes[cur];
  $("#hn").textContent = String(cur + 1).padStart(2, "0"); $("#ht").textContent = TITLES[sc.id];
  const hp = E(t, sc.t0 - 1.1, .8); $("#hdr").style.opacity = t < 1 ? E(t, 0, 1) : 1; $("#ht").style.opacity = hp; $("#hn").style.opacity = hp;
  [...$("#dots").children].forEach((d, k) => { const s2 = TL.scenes[k]; d.firstChild.style.width = (100 * cl((t - s2.t0) / s2.dur)) + "%"; });
  // caption: current line with word-by-word highlight
  let ln = null; for (const s2 of TL.scenes) for (const l of s2.lines) if (t >= l.t0 - .05 && t < l.t1 + .25) ln = l;
  const lineEl = $("#line");
  if (ln) {
    if (lineEl.dataset.k !== ln.text) { lineEl.dataset.k = ln.text; lineEl.innerHTML = ln.text.split(" ").map(w => `<span class="w">${w}</span>`).join(" "); }
    const ws = lineEl.children, p = cl((t - ln.t0) / Math.max(.5, ln.t1 - ln.t0 - .35));
    for (let k = 0; k < ws.length; k++) ws[k].classList.toggle("on", k < Math.ceil(p * ws.length));
    lineEl.style.opacity = Math.min(E(t, ln.t0 - .05, .25), 1);
  } else { lineEl.style.opacity = 0; }
  const sp = ln ? ln.s : null;
  $("#wM").classList.toggle("on", sp === "Maya"); $("#wS").classList.toggle("on", sp === "Sam");
  $("#wM .av").style.setProperty("--lv", sp === "Maya" ? lv : 0); $("#wS .av").style.setProperty("--lv", sp === "Sam" ? lv : 0);
  $("#cap").style.opacity = E(t, 1.5, 1);
}
window.render = render;

/* ---------- deck controller: each stop is a moment in the video where a new box has settled ---------- */
const STOPS = {
  intro: L => [1.2, L[1] + 1.8, L[1] + 2.7, L[1] + 3.6],
  frame: L => [L[1] + 1.1, L[1] + 3.3, L[1] + 5.5, L[1] + 7.7, L[3] + 2.3, L[3] + 7.4, L[3] + 9.7, L[4] + 1.1],
  rule: L => [1.5, L[1] + 2.2, L[1] + 6.2, L[1] + 10.7, L[3] - 1.8],
  ingest: L => [L[1] + 1.7, L[1] + 3.2, L[1] + 12.1, L[3] + 1, L[5] + .7, L[5] + 3.7, L[5] + 7.2],
  kafka: L => [.5, L[1] + 1.2, L[1] + 3.7, L[2] + .4, L[2] + 2.7, L[3] + 2.9, L[3] + 4.9, L[3] + 6.7],
  data: L => [L[1] + 1, L[1] + 2.7, L[2] + .5, L[3] - 1.3, L[3] + 5.7, L[3] + 9.3, L[3] + 12, L[3] + 13.2],
  search: L => [.7, L[1] + 1.1, L[1] + 4.7, L[2] + .8, L[3] + 2.2, L[3] + 4.1, L[3] + 8.1, L[5] + 6.1],
  cache: L => [L[1] + .9, L[3] + .9, L[3] + 10.2, L[5] + .9, L[5] + 6.8],
  cost: L => [.5, L[1] + 2.5, L[1] + 6.5, L[1] + 7.2, L[1] + 13.6, L[3] + 1.2, L[3] + 5.7, L[3] + 9.2, L[5] + .9],
  close: L => [L[1] + 1.1, L[1] + 3.4, L[1] + 7.9, L[1] + 13.4, L[3] + 1],
};
const stops = [];
TL.scenes.forEach((sc, i) => { const L = sc.lines.map(l => l.t0 - sc.t0); STOPS[sc.id](L).forEach(r => stops.push({ t: sc.t0 + r, i })); });
const deck = $("#deck"), lineEl = $("#line"), hintN = $("#hn2"), hintS = $("#hs");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let k = 0, tNow = stops[0].t, anim = null;
function caption(t) {
  const sc = TL.scenes[stops[k].i];
  let ln = sc.lines[0]; for (const l of sc.lines) if (l.t0 <= t + .05) ln = l;
  if (lineEl.dataset.k !== ln.text) { lineEl.dataset.k = ln.text; lineEl.innerHTML = ln.text.split(" ").map(w => `<span class="w on">${w}</span>`).join(" "); }
  [...lineEl.children].forEach(w => w.classList.add("on"));
  lineEl.style.opacity = 1;
  $("#wM").classList.toggle("on", ln.s === "Maya"); $("#wS").classList.toggle("on", ln.s === "Sam");
}
function frame(now) {
  render(tNow);
  const w = now / 1000;
  $("#glow").style.transform = `translate(${-200 + 260 * Math.sin(w / 9)}px, ${-500 + 160 * Math.cos(w / 13)}px)`;
  $("#glow2").style.transform = `translate(${1100 + 200 * Math.cos(w / 11)}px, ${300 + 120 * Math.sin(w / 8)}px)`;
  $("#bg").style.backgroundPosition = `${-w * 4}px ${-w * 2}px`;
  if (anim) {
    const p = Math.min(1, (now - anim.s) / anim.d);
    tNow = anim.a + (anim.b - anim.a) * ease(p);
    if (p >= 1) { tNow = anim.b; anim = null; }
  }
  requestAnimationFrame(frame);
}
function go(n) {
  n = Math.max(0, Math.min(stops.length - 1, n)); if (n === k && !anim) return;
  const from = anim ? anim.b : tNow, to = stops[n].t, fwd = to > from;
  const d = reduce ? 1 : fwd ? Math.min(1900, Math.max(750, 500 + (to - from) * 120)) : 450;
  if (anim) tNow = anim.b;
  k = n; anim = { a: tNow, b: to, s: performance.now(), d };
  hintN.textContent = `${k + 1} / ${stops.length}`;
  hintS.textContent = String(stops[k].i + 1).padStart(2, "0") + " · " + TITLES[TL.scenes[stops[k].i].id];
  try { history.replaceState(null, "", "#s" + (k + 1)); } catch (e) {}
}
const sceneStart = i => stops.findIndex(s => s.i === i);
addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const cur = stops[k].i;
  if (["ArrowRight", " ", "PageDown", "Enter"].includes(e.key)) go(k + 1);
  else if (["ArrowLeft", "PageUp", "Backspace"].includes(e.key)) go(k - 1);
  else if (e.key === "ArrowDown") go(cur < TL.scenes.length - 1 ? sceneStart(cur + 1) : stops.length - 1);
  else if (e.key === "ArrowUp") go(k > sceneStart(cur) ? sceneStart(cur) : sceneStart(Math.max(0, cur - 1)));
  else if (e.key === "Home") go(0);
  else if (e.key === "End") go(stops.length - 1);
  else if (e.key === "f" || e.key === "F") { (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.())?.catch?.(() => {}); }
  else return;
  e.preventDefault();
});
deck.addEventListener("click", e => { const r = deck.getBoundingClientRect(); go(e.clientX - r.left < r.width / 3 ? k - 1 : k + 1); });
function fit() { const s = Math.min(innerWidth / 1920, innerHeight / 1080); deck.style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`; }
addEventListener("resize", fit); fit();
const m = /^#s(\d+)$/.exec(location.hash); if (m) { k = Math.max(0, Math.min(stops.length - 1, +m[1] - 1)); tNow = stops[k].t; }
hintN.textContent = `${k + 1} / ${stops.length}`;
hintS.textContent = String(stops[k].i + 1).padStart(2, "0") + " · " + TITLES[TL.scenes[stops[k].i].id];
document.fonts.ready.then(() => requestAnimationFrame(frame));
</script>
