<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rehearsal Scenes</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=block">
<!-- Minimal scene engine in the style of the HomeFinder rehearsal video.
     Load order: timeline.js (window.TL from build_timeline.py), then this page's script.
     window.render(t) draws the frame at t seconds and is all render.mjs needs.
     Open without #render to preview it playing in real time with the audio beside it. -->
<script src="timeline.js"></script>
<style>
:root {
  --bg: #121211; --sheet: #1f1f1d; --sheet2: #292926; --ink: #efeee9; --ink2: #b6b3ab; --ink3: #85827a;
  --hair: rgba(255,255,250,.09); --hair2: rgba(255,255,250,.16);
  --accent: #8aa6f5; --signal: #f2845f; --ok: #7fd1a0;
  --sans: "Geist", system-ui, sans-serif; --mono: "Geist Mono", ui-monospace, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; margin: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
#deck { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; transform-origin: 0 0; }
#bg { position: absolute; inset: 0; background-image: radial-gradient(rgba(255,255,250,.07) 1.2px, transparent 1.4px); background-size: 36px 36px; }
#glow { position: absolute; width: 1400px; height: 1400px; border-radius: 50%; background: radial-gradient(circle, rgba(138,166,245,.13), transparent 62%); }
.abs { position: absolute; }
#hdr { left: 96px; top: 64px; display: grid; gap: 10px; }
#hdr .t { font: 600 34px/1.1 var(--sans); display: flex; gap: 16px; align-items: baseline; }
#hdr .t em { font: 500 26px/1 var(--mono); font-style: normal; color: var(--accent); }
#dots { right: 96px; top: 74px; display: flex; gap: 10px; }
#dots i { width: 34px; height: 4px; border-radius: 4px; background: var(--hair2); overflow: hidden; display: block; }
#dots i u { display: block; height: 100%; width: 0; background: var(--ink); }
.scene { position: absolute; left: 96px; top: 170px; width: 1728px; height: 660px; }
.card { position: absolute; background: var(--sheet); border-radius: 22px; box-shadow: 0 30px 70px rgba(0,0,0,.45), 0 0 0 1px var(--hair); padding: 28px 30px; }
.big { font: 600 92px/1.02 var(--sans); letter-spacing: -.035em; }
/* captions: speakers on the left, the current line on the right, words light up as they are said */
#cap { left: 96px; right: 96px; top: 872px; height: 150px; display: grid; grid-template-columns: 300px 1fr; gap: 40px; }
.who { display: flex; align-items: center; gap: 14px; opacity: .38; margin-bottom: 14px; }
.who.on { opacity: 1; }
.av { position: relative; width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; font: 600 20px/1 var(--sans); color: #121211; }
.av::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 2px solid currentColor; opacity: var(--lv, 0); transform: scale(calc(1 + var(--lv, 0) * .25)); }
.who b { font-size: 19px; font-weight: 600; display: block; }
.who small { font: 400 14px/1.2 var(--mono); color: var(--ink3); }
#line { font: 500 33px/1.42 var(--sans); color: var(--ink3); max-width: 1300px; }
#line .w.on { color: var(--ink); }
</style></head><body>
<div id="deck">
  <div id="bg"></div><div id="glow" class="abs"></div>
  <div id="hdr" class="abs"><span class="t"><em id="hn">01</em><span id="ht"></span></span></div>
  <div id="dots" class="abs"></div>
  <div id="stage"></div>
  <div id="cap" class="abs">
    <div>
      <div class="who" id="wA"><span class="av" style="background:#f2c48a;color:#f2c48a"><span style="color:#121211">M</span></span><span><b>Maya</b><small>plays the committee</small></span></div>
      <div class="who" id="wB"><span class="av" style="background:var(--accent);color:var(--accent)"><span style="color:#121211">S</span></span><span><b>Sam</b><small>the architect</small></span></div>
    </div>
    <div id="line"></div>
  </div>
</div>
<script>
const SPK = { A: "Maya", B: "Sam" };
const TITLES = { intro: "Tomorrow's pitch" };   // one title per scene id; say the point, not a topic
const $ = s => document.querySelector(s);
const eo = p => 1 - Math.pow(1 - p, 3), cl = v => Math.max(0, Math.min(1, v));
const E = (t, a, d = .7) => eo(cl((t - a) / d));
const sh = (el, p, dy = 26) => { el.style.opacity = p; el.style.transform = `translateY(${(1 - p) * dy}px)`; };
const mk = (parent, html, cls = "", style = "") => { const d = document.createElement("div"); d.className = cls; d.style.cssText = style; d.innerHTML = html; parent.appendChild(d); return d; };

/* Scene builders: create elements once, return draw(lt, L). lt = seconds since the scene started,
   L[k] = when line k starts (relative). Key every reveal to a line so the picture follows the voice. */
const B = {};
B.intro = el => {
  const t1 = mk(el, "How to pitch the design", "big abs", "left:0;top:150px");
  const c = [0, 1, 2].map(k => mk(el, `<b style="font-size:28px">Part ${k + 1}</b>`, "card", `left:${k * 420}px;top:360px;width:390px`));
  return (t, L) => { sh(t1, E(t, -.6, 1), 40); c.forEach((x, k) => sh(x, E(t, (L[1] ?? 1) + .8 + k * .9))); };
};
const fallback = el => { const h = mk(el, "", "big abs", "left:0;top:150px"); return () => { h.textContent = ""; }; };

const S = {};
TL.scenes.forEach(sc => { const el = mk($("#stage"), "", "scene"); S[sc.id] = { el, draw: (B[sc.id] || fallback)(el) }; });
$("#dots").innerHTML = TL.scenes.map(() => "<i><u></u></i>").join("");

function render(t) {
  const lv = TL.env[Math.min(TL.env.length - 1, Math.floor(t * TL.fps))] || 0;
  $("#glow").style.transform = `translate(${-200 + 260 * Math.sin(t / 23)}px, ${-500 + 160 * Math.cos(t / 31)}px)`;
  $("#bg").style.backgroundPosition = `${-t * 4}px ${-t * 2}px`;
  let cur = 0; TL.scenes.forEach((sc, i) => { if (t >= sc.t0 - 1) cur = i; });
  TL.scenes.forEach((sc, i) => {
    const s = S[sc.id], end = sc.t0 + sc.dur, inP = E(t, sc.t0 - 1.1, .9), outP = 1 - cl((t - end - .5) / .7);
    const vis = i === TL.scenes.length - 1 ? inP : Math.min(inP, outP);
    s.el.style.display = vis <= .001 ? "none" : "block"; if (vis <= .001) return;
    s.el.style.opacity = vis; s.el.style.transform = `translateY(${(1 - inP) * 30 - (1 - outP) * 20}px)`;
    s.draw(t - sc.t0, sc.lines.map(l => l.t0 - sc.t0));
  });
  const sc = TL.scenes[cur];
  $("#hn").textContent = String(cur + 1).padStart(2, "0"); $("#ht").textContent = TITLES[sc.id] || sc.id;
  [...$("#dots").children].forEach((d, k) => { const s2 = TL.scenes[k]; d.firstChild.style.width = (100 * cl((t - s2.t0) / s2.dur)) + "%"; });
  let ln = null; for (const s2 of TL.scenes) for (const l of s2.lines) if (t >= l.t0 - .05 && t < l.t1 + .25) ln = l;
  const lineEl = $("#line");
  if (ln) {
    if (lineEl.dataset.k !== ln.text) { lineEl.dataset.k = ln.text; lineEl.innerHTML = ln.text.split(" ").map(w => `<span class="w">${w}</span>`).join(" "); }
    const ws = lineEl.children, p = cl((t - ln.t0) / Math.max(.5, ln.t1 - ln.t0 - .35));
    for (let k = 0; k < ws.length; k++) ws[k].classList.toggle("on", k < Math.ceil(p * ws.length));
    lineEl.style.opacity = E(t, ln.t0 - .05, .25);
  } else lineEl.style.opacity = 0;
  const sp = ln ? ln.s : null;
  for (const [id, name] of [["#wA", SPK.A], ["#wB", SPK.B]]) {
    $(id).classList.toggle("on", sp === name); $(id + " .av").style.setProperty("--lv", sp === name ? lv : 0);
  }
}
window.render = render;

/* Preview mode: play in real time, scaled to the window. render.mjs opens the page with #render and drives render(t) itself. */
if (location.hash !== "#render") {
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); $("#deck").style.transform = `translate(${(innerWidth - 1920 * s) / 2}px, ${(innerHeight - 1080 * s) / 2}px) scale(${s})`; };
  addEventListener("resize", fit); fit();
  const t0 = performance.now(); (function tick(now) { render(((now - t0) / 1000) % TL.total); requestAnimationFrame(tick); })(t0);
}
</script>
</body></html>
